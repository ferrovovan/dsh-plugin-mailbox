- insert:
    - id: mailbox
      name: '@local/dsh-mailbox'
      config:
        root: /home/vovan/Предприниматель/Mailbox
        role: Coordinator   # чей ящик принимаем: Coordinator | Assistant
        targetSession: ""   # id сессии-получателя; пусто — доставку не делать
        enabled: true       # рубильник ВКЛ словами Мастера 2026-11-05
        limitPerHour: 6     # почасовой порог приёмки; 0 — без лимита
